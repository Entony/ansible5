---
- name: Создание директории для данных Vector
  ansible.builtin.file:
    path: /var/lib/vector
    state: directory
    mode: "0755"

- name: Создание директории для Vector
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    mode: "0755"

- name: Скачивание Vector
  ansible.builtin.get_url:
    url: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-musl.tar.gz"
    dest: "/tmp/vector-{{ vector_version }}.tar.gz"
    mode: "0644"

- name: Разархивация Vector
  ansible.builtin.unarchive:
    src: "/tmp/vector-{{ vector_version }}.tar.gz"
    dest: "/tmp"
    remote_src: true
    creates: "/tmp/vector-x86_64-unknown-linux-musl"

- name: Установка Vector
  ansible.builtin.copy:
    src: "/tmp/vector-x86_64-unknown-linux-musl/bin/vector"
    dest: "/usr/local/bin/vector"
    mode: "0755"
    remote_src: true

- name: Создание службы systemd для Vector
  ansible.builtin.copy:
    dest: "/etc/systemd/system/vector.service"
    mode: "0644"
    content: |
      [Unit]
      Description=Vector Log Agent
      Documentation=https://vector.dev
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/vector --config {{ vector_config_dir }}/vector.toml
      Restart=always
      RestartSec=5
      StandardOutput=syslog
      StandardError=syslog
      SyslogIdentifier=vector

      [Install]
      WantedBy=multi-user.target
  notify: Restart vector service

- name: Настройка Vector из шаблона
  ansible.builtin.template:
    src: vector.toml.j2
    dest: "{{ vector_config_dir }}/vector.toml"
    mode: "0644"
  notify: Restart vector service

- name: Настройка запуска и рестарта Vector
  ansible.builtin.service:
    name: vector
    state: started
    enabled: true
  ignore_errors: true 
