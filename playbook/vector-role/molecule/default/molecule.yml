---
dependency:
  name: galaxy
  enabled: false
driver:
  name: podman # <-- Строго podman по заданию
platforms:
  - name: ubuntu-compatibility
    # Используем готовый и протестированный образ окружения Ansible
    image: ghcr.io/ansible/creator-ee:v0.22.0
    privileged: true
    pre_build_image: true # <-- Отключает внутреннюю сборку (снимает ошибку cgroups)
provisioner:
  name: ansible
  env:
    ANSIBLE_REMOTE_TMP: /tmp/.ansible/tmp
verifier:
  name: ansible
prerun: false

scenario:
  name: compatibility
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
